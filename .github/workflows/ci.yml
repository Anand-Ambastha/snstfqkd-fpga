name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  regress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog verilator
          pip install yowasp-yosys
      - name: Full regression (lint, python tests, directed, exhaustive, random, gate-level)
        run: make regress YOSYS=yowasp-yosys
      - name: CXXRTL comparison and synthesis estimate
        run: |
          INC=$(python3 -c "import yowasp_yosys,os;print(os.path.dirname(yowasp_yosys.__file__))")/share/include/backends/cxxrtl/runtime
          make cxxrtl synth YOSYS=yowasp-yosys YOSYS_INC=$INC
  mutation:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: make mutate
